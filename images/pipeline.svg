<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="570" fill="#ffffff"/>

  <!-- ========== 建库 ========== -->
  <text x="20" y="29" font-size="15" font-weight="700" fill="#111827">建库</text>
  <text x="58" y="29" font-size="12" fill="#6b7280">每份文档建一次</text>

  <rect x="20" y="50" width="120" height="80" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="80" y="84" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">PDF 文档</text>
  <text x="80" y="106" font-size="12" fill="#374151" text-anchor="middle">如：车主手册</text>

  <rect x="180" y="50" width="140" height="80" rx="8" fill="#eef3fc" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="250" y="76" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">解析</text>
  <text x="250" y="97" font-size="12.5" fill="#374151" text-anchor="middle">取出文字、插图、图题</text>
  <text x="250" y="117" font-size="11.5" fill="#6b7280" text-anchor="middle">PyMuPDF</text>

  <rect x="360" y="50" width="140" height="80" rx="8" fill="#eef3fc" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="430" y="76" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">整理</text>
  <text x="430" y="97" font-size="12.5" fill="#374151" text-anchor="middle">整理抽取的内容</text>
  <text x="430" y="117" font-size="11.5" fill="#6b7280" text-anchor="middle">LLM API</text>

  <rect x="540" y="50" width="160" height="80" rx="8" fill="#eef3fc" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="620" y="76" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">切分</text>
  <text x="620" y="97" font-size="12.5" fill="#374151" text-anchor="middle">切成父子文档</text>
  <text x="620" y="117" font-size="11.5" fill="#6b7280" text-anchor="middle">m3e-small</text>

  <text x="740" y="33" font-size="12" font-weight="700" fill="#6b7280">存储</text>
  <rect x="740" y="40" width="240" height="112" rx="8" fill="#eef3fc" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="756" y="66" font-size="13.5" font-weight="700" fill="#111827">原文、页码、插图</text>
  <text x="964" y="66" font-size="11.5" fill="#6b7280" text-anchor="end">MongoDB</text>
  <line x1="752" y1="78" x2="968" y2="78" stroke="#c7d6f3"/>
  <text x="756" y="100" font-size="13.5" font-weight="700" fill="#111827">关键词索引</text>
  <text x="964" y="100" font-size="11.5" fill="#6b7280" text-anchor="end">BM25</text>
  <line x1="752" y1="112" x2="968" y2="112" stroke="#c7d6f3"/>
  <text x="756" y="134" font-size="13.5" font-weight="700" fill="#111827">向量索引</text>
  <text x="964" y="134" font-size="11.5" fill="#6b7280" text-anchor="end">Milvus · BGE-M3</text>

  <line x1="140" y1="90" x2="178" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="90" x2="358" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="90" x2="538" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="90" x2="738" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M860,152 L860,216 L250,216 L250,262" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="555" y="209" font-size="11.5" fill="#6b7280" text-anchor="middle">检索时查这两个索引</text>

  <!-- ========== 回答问题 ========== -->
  <text x="20" y="261" font-size="15" font-weight="700" fill="#111827">回答问题</text>
  <text x="20" y="279" font-size="11.5" fill="#6b7280">每次提问时</text>

  <rect x="20" y="310" width="120" height="90" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="80" y="352" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">问题</text>
  <text x="80" y="374" font-size="12" fill="#374151" text-anchor="middle">用户输入</text>

  <!-- 两种检索 -->
  <rect x="170" y="264" width="160" height="156" rx="10" fill="none" stroke="#9fd3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="180" y="274" width="140" height="64" rx="8" fill="#eaf6f0" stroke="#2e9e6a" stroke-width="1.5"/>
  <text x="250" y="295" font-size="14.5" font-weight="700" fill="#111827" text-anchor="middle">关键词检索</text>
  <text x="250" y="313" font-size="12" fill="#374151" text-anchor="middle">按词匹配</text>
  <text x="250" y="330" font-size="11.5" fill="#6b7280" text-anchor="middle">BM25</text>
  <rect x="180" y="348" width="140" height="64" rx="8" fill="#eaf6f0" stroke="#2e9e6a" stroke-width="1.5"/>
  <text x="250" y="369" font-size="14.5" font-weight="700" fill="#111827" text-anchor="middle">向量检索</text>
  <text x="250" y="387" font-size="12" fill="#374151" text-anchor="middle">按向量相似度匹配</text>
  <text x="250" y="404" font-size="11.5" fill="#6b7280" text-anchor="middle">BGE-M3</text>

  <!-- 合并 -->
  <rect x="355" y="310" width="120" height="90" rx="8" fill="#eaf6f0" stroke="#2e9e6a" stroke-width="1.5"/>
  <text x="415" y="342" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">合并</text>
  <text x="415" y="364" font-size="12.5" fill="#374151" text-anchor="middle">换成父文档，</text>
  <text x="415" y="381" font-size="12.5" fill="#374151" text-anchor="middle">去重</text>

  <!-- 排序 -->
  <rect x="505" y="310" width="150" height="90" rx="8" fill="#fbf1e6" stroke="#d9822b" stroke-width="1.5"/>
  <text x="580" y="335" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">精排</text>
  <text x="580" y="356" font-size="12.5" fill="#374151" text-anchor="middle">逐段打分，</text>
  <text x="580" y="373" font-size="12.5" fill="#374151" text-anchor="middle">留下最相关的几段</text>
  <text x="580" y="391" font-size="11.5" fill="#6b7280" text-anchor="middle">bge-reranker-v2-m3</text>

  <!-- 生成 -->
  <rect x="685" y="310" width="150" height="90" rx="8" fill="#f3eefa" stroke="#8455c8" stroke-width="1.5"/>
  <text x="760" y="335" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">生成</text>
  <text x="760" y="356" font-size="12.5" fill="#374151" text-anchor="middle">作答并标出引用编号，</text>
  <text x="760" y="373" font-size="12.5" fill="#374151" text-anchor="middle">查不到时答“无答案”</text>
  <text x="760" y="391" font-size="11.5" fill="#6b7280" text-anchor="middle">Qwen3-8B</text>

  <!-- 附上出处 -->
  <rect x="860" y="310" width="120" height="90" rx="8" fill="#f3eefa" stroke="#8455c8" stroke-width="1.5"/>
  <text x="920" y="342" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">附上出处</text>
  <text x="920" y="364" font-size="12.5" fill="#374151" text-anchor="middle">按编号找回</text>
  <text x="920" y="381" font-size="12.5" fill="#374151" text-anchor="middle">页码和插图</text>

  <path d="M140,355 L160,355 L160,306 L178,306" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M160,355 L160,380 L178,380" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320,306 L338,306 L338,355 L353,355" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320,380 L338,380 L338,355" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="475" y1="355" x2="503" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="355" x2="683" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="835" y1="355" x2="858" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== 示例 ========== -->
  <text x="20" y="446" font-size="12" font-weight="700" fill="#6b7280">示例</text>
  <g font-size="12" fill="#374151">
    <rect x="20" y="456" width="120" height="78" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-dasharray="4 3"/>
    <text x="30" y="478">仪表盘可以显示</text>
    <text x="30" y="496">哪些车辆状态</text>
    <text x="30" y="514">信息？</text>

    <rect x="180" y="456" width="140" height="78" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-dasharray="4 3"/>
    <text x="190" y="478">关键词检索 10 段</text>
    <text x="190" y="496">向量检索 10 段</text>

    <rect x="355" y="456" width="120" height="78" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-dasharray="4 3"/>
    <text x="365" y="478">换成父文档，</text>
    <text x="365" y="496">去重后剩 8 段</text>

    <rect x="505" y="456" width="150" height="78" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-dasharray="4 3"/>
    <text x="515" y="478">取最相关的 5 段，</text>
    <text x="515" y="496">编号【1】…【5】</text>
    <text x="515" y="514">交给生成模型</text>

    <rect x="685" y="456" width="150" height="78" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-dasharray="4 3"/>
    <text x="695" y="478">组合仪表可显示车速、</text>
    <text x="695" y="496">发动机转速、燃油量</text>
    <text x="695" y="514">等信息。【1, 3】</text>

    <rect x="860" y="456" width="120" height="78" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-dasharray="4 3"/>
    <text x="870" y="478">出处：41、43 页</text>
    <text x="870" y="496">插图：图12</text>
  </g>

  <text x="980" y="558" font-size="11.5" fill="#6b7280" text-anchor="end">框内灰字为本项目所用的模型或工具，可替换；示例为示意</text>
</svg>
